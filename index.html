<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>House Cleaning</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cleaning">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0c1a24; color: #f8fafc; min-height: 100vh; padding: 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .lang-toggle { margin-bottom: 12px; }
    .lang-toggle button { width: auto; padding: 6px 12px; background: #142833; color: #7dd3fc; margin-right: 8px; }
    .lang-toggle button.active { background: #0ea5e9; color: white; }
    .summary { display: flex; gap: 10px; margin-bottom: 12px; font-size: 0.85rem; flex-wrap: wrap; }
    .summary div { background: #142833; padding: 10px 12px; border-radius: 12px; flex: 1; min-width: 120px; }
    .summary .label { color: #7dd3fc; font-size: 0.7rem; }
    .add-form, .job, .biz-form { background: #142833; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    input, select, button, textarea { font-family: inherit; font-size: 1rem; padding: 10px; border-radius: 10px; border: none; width: 100%; margin-bottom: 8px; }
    input, select, textarea { background: #0c1a24; color: white; }
    textarea { min-height: 60px; resize: vertical; }
    button.add, button.line, button.clear, button.save-biz { background: #0ea5e9; color: white; font-weight: 600; cursor: pointer; width: auto; padding: 10px 16px; }
    button.line { font-size: 0.85rem; margin-bottom: 12px; }
    button.clear { background: #7f1d1d; margin-top: 8px; }
    button.save-biz { margin-top: 4px; }
    .line-item { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .line-item select, .line-item input { margin: 0; flex: 1; }
    .line-item .qty { max-width: 70px; }
    .line-item .price { max-width: 90px; }
    .job .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .job .client { font-weight: 600; }
    .job .amount { color: #7dd3fc; font-weight: 600; }
    .job .meta { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    .job .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .job button { width: auto; padding: 6px 12px; font-size: 0.85rem; background: #0ea5e9; color: white; }
    .lines { font-size: 0.8rem; color: #cbd5e1; margin-top: 6px; }
    .status-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; background: #1e3a4a; }
    .row { display: flex; gap: 8px; }
    .row input, .row select { flex: 1; }
    label { display: block; font-size: 0.85rem; color: #7dd3fc; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="lang-toggle">
    <button id="btnEn" class="active">English</button>
    <button id="btnEs">Español</button>
  </div>
  <h1 id="appTitle">House Cleaning</h1>
  <div class="summary">
    <div><div class="label" id="lblReceived">Received</div><div id="received">$0</div></div>
    <div><div class="label" id="lblPending">Pending</div><div id="pending">$0</div></div>
    <div><div class="label" id="lblJobs">Jobs</div><div id="jobCount">0</div></div>
  </div>

  <div class="biz-form">
    <div style="font-size:0.85rem; margin-bottom:8px; color:#7dd3fc;" id="bizHeader">Your Business Info (appears on invoices)</div>
    <input id="bizName" placeholder="Business name" />
    <input id="bizAddress" placeholder="Business address" />
    <input id="bizPhone" placeholder="Business phone" />
    <div class="row">
      <div style="flex:1">
        <label style="font-size:0.75rem; color:#7dd3fc;">Net (days)</label>
        <input id="paymentTerms" type="number" value="14" />
      </div>
      <div style="flex:1">
        <label style="font-size:0.75rem; color:#7dd3fc;">Discount %</label>
        <input id="discountDefault" type="number" step="0.01" value="0" />
      </div>
    </div>
    <div class="row">
      <div style="flex:1">
        <label style="font-size:0.75rem; color:#7dd3fc;">Standard $/sqft</label>
        <input id="stdRate" type="number" step="0.001" value="0.078" />
      </div>
      <div style="flex:1">
        <label style="font-size:0.75rem; color:#7dd3fc;">Deep clean $/sqft</label>
        <input id="deepRate" type="number" step="0.001" value="0.12" />
      </div>
    </div>
    <button class="save-biz" id="saveBiz">Save Business Info</button>
  </div>

  <div class="add-form">
    <input id="client" placeholder="Customer name" />
    <input id="address" placeholder="Customer address" />
    <input id="phone" placeholder="Phone (optional)" />
    <input id="email" placeholder="Email (optional)" />
    <input id="crew" placeholder="Cleaner / Crew name" />
    <label id="lblPricing">Pricing Method</label>
    <select id="pricingMethod">
      <option value="rooms" id="optRooms">By Room Type</option>
      <option value="sqft" id="optSqft">By Square Footage</option>
    </select>
    <div id="roomsSection">
      <div id="lines"></div>
      <button class="line" type="button" id="addLine">+ Add Room</button>
    </div>
    <div id="sqftSection" style="display:none;">
      <input id="sqft" type="number" placeholder="Total square footage" />
      <div class="row">
        <select id="rateType">
          <option value="0.078" id="optStd">Standard ($0.078/sqft)</option>
          <option value="0.12" id="optDeep">Deep Clean ($0.12/sqft)</option>
          <option value="custom" id="optCustom">Custom rate</option>
        </select>
        <input id="customRate" type="number" step="0.01" placeholder="Custom $/sqft" style="display:none;" />
      </div>
    </div>
    <label id="lblService">Service Level</label>
    <select id="serviceLevel">
      <option value="maintenance" id="optMaint">Maintenance Clean</option>
      <option value="deep" id="optDeepSvc">Deep Clean</option>
      <option value="moveout" id="optMove">Move-in / Move-out</option>
      <option value="postcon" id="optPost">Post-construction</option>
    </select>
    <label id="lblFreq">Frequency</label>
    <select id="frequency">
      <option value="0" id="optOnce">One-time (full price)</option>
      <option value="15" id="optWeek">Weekly (15% off)</option>
      <option value="10" id="optBi">Bi-weekly (10% off)</option>
      <option value="5" id="optMonth">Monthly (5% off)</option>
    </select>
    <label><input type="checkbox" id="ecoUpcharge" /> <span id="lblEco">Eco-friendly / non-toxic chemicals (+15%)</span></label>
    <div class="row">
      <input id="countyTax" type="number" step="0.01" placeholder="Tax %" value="0" />
      <input id="discount" type="number" step="0.01" placeholder="Extra discount %" value="0" />
    </div>
    <textarea id="notes" placeholder="Notes (gate code, pets, preferences, parking…)"></textarea>
    <button class="add" id="save">Save Job</button>
  </div>
  <button class="clear" id="clearBtn">Clear Phone Jobs</button>
  <div id="list"></div>

  <script>
    const { jsPDF } = window.jspdf;
    const LANG_KEY = "cleaning-lang";
    let lang = localStorage.getItem(LANG_KEY) || "en";

    const t = {
      en: {
        title: "House Cleaning", received: "Received", pending: "Pending", jobs: "Jobs",
        bizHeader: "Your Business Info (appears on invoices)",
        bizName: "Business name", bizAddress: "Business address", bizPhone: "Business phone",
        paymentTerms: "Net (days)", discountDefault: "Default discount %", saveBiz: "Save Business Info",
        client: "Customer name", address: "Customer address", phone: "Phone (optional)", email: "Email (optional)",
        crew: "Cleaner / Crew name", pricing: "Pricing Method", rooms: "By Room Type", sqft: "By Square Footage",
        addLine: "+ Add Room", sqftPh: "Total square footage", std: "Standard ($0.078/sqft)", deepRate: "Deep Clean ($0.12/sqft)", custom: "Custom rate", customPh: "Custom $/sqft",
        service: "Service Level", maint: "Maintenance Clean", deep: "Deep Clean", move: "Move-in / Move-out", post: "Post-construction",
        freq: "Frequency", once: "One-time (full price)", week: "Weekly (15% off)", bi: "Bi-weekly (10% off)", month: "Monthly (5% off)",
        eco: "Eco-friendly / non-toxic chemicals (+15%)", tax: "Tax %", extraDisc: "Extra discount %",
        notes: "Notes (gate code, pets, preferences, parking…)", save: "Save Job", clear: "Clear Phone Jobs",
        viewInvoice: "View Invoice", accept: "Accept", start: "Start Work", invoice: "Raise Invoice", paid: "Mark Paid",
        noCrew: "No crew", noItems: "No items", notesPrefix: "Notes: ",
        needRoom: "Need a customer and at least one room with a price", needSqft: "Need a customer and square footage", needCustom: "Enter a custom rate",
        bizSaved: "Business info saved.", clearConfirm: "Clear all jobs from this phone?", cleared: "Phone jobs cleared.",
        statuses: { quote: "Quoted", accepted: "Accepted", wip: "Work in Progress", invoiced: "Invoiced", paid: "Paid" },
        roomsList: ["Bedroom", "Bathroom", "Kitchen", "Living Room", "Dining Room", "Office / Den", "Laundry Room", "Entry / Hall", "Other"]
      },
      es: {
        title: "Limpieza de Casa", received: "Recibido", pending: "Pendiente", jobs: "Trabajos",
        bizHeader: "Información de su negocio (aparece en las facturas)",
        bizName: "Nombre del negocio", bizAddress: "Dirección del negocio", bizPhone: "Teléfono del negocio",
        paymentTerms: "Net (días)", discountDefault: "Descuento predeterminado %", saveBiz: "Guardar información",
        client: "Nombre del cliente", address: "Dirección del cliente", phone: "Teléfono (opcional)", email: "Correo (opcional)",
        crew: "Nombre del limpiador / equipo", pricing: "Método de precio", rooms: "Por tipo de habitación", sqft: "Por pies cuadrados",
        addLine: "+ Agregar habitación", sqftPh: "Pies cuadrados totales", std: "Estándar ($0.078/pie²)", deepRate: "Limpieza profunda ($0.12/pie²)", custom: "Tarifa personalizada", customPh: "Tarifa personalizada $/pie²",
        service: "Nivel de servicio", maint: "Limpieza de mantenimiento", deep: "Limpieza profunda", move: "Mudanza entrada/salida", post: "Post-construcción",
        freq: "Frecuencia", once: "Una vez (precio completo)", week: "Semanal (15% descuento)", bi: "Quincenal (10% descuento)", month: "Mensual (5% descuento)",
        eco: "Químicos ecológicos / sin tóxicos (+15%)", tax: "Impuesto %", extraDisc: "Descuento extra %",
        notes: "Notas (código de portón, mascotas, preferencias, estacionamiento…)", save: "Guardar trabajo", clear: "Borrar trabajos del teléfono",
        viewInvoice: "Ver factura", accept: "Aceptar", start: "Comenzar trabajo", invoice: "Generar factura", paid: "Marcar pagado",
        noCrew: "Sin equipo", noItems: "Sin artículos", notesPrefix: "Notas: ",
        needRoom: "Se necesita un cliente y al menos una habitación con precio", needSqft: "Se necesita un cliente y pies cuadrados", needCustom: "Ingrese una tarifa personalizada",
        bizSaved: "Información guardada.", clearConfirm: "¿Borrar todos los trabajos de este teléfono?", cleared: "Trabajos del teléfono borrados.",
        statuses: { quote: "Cotizado", accepted: "Aceptado", wip: "En progreso", invoiced: "Facturado", paid: "Pagado" },
        roomsList: ["Dormitorio", "Baño", "Cocina", "Sala", "Comedor", "Oficina / Estudio", "Lavandería", "Entrada / Pasillo", "Otro"]
      }
    };

    const KEY = "cleaning-jobs-v1";
    const BIZ_KEY = "cleaning-biz-v1";
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbxljqDbThH-aAcGHFdvsyS854LLx43WWgFC8TEKdEO7ffRtn8HJl8UM0yK2DIo5NYmyrQ/exec";

    function tr(key) { return t[lang][key] || key; }

    function applyLang() {
      document.getElementById("appTitle").textContent = tr("title");
      document.getElementById("lblReceived").textContent = tr("received");
      document.getElementById("lblPending").textContent = tr("pending");
      document.getElementById("lblJobs").textContent = tr("jobs");
      document.getElementById("bizHeader").textContent = tr("bizHeader");
      document.getElementById("bizName").placeholder = tr("bizName");
      document.getElementById("bizAddress").placeholder = tr("bizAddress");
      document.getElementById("bizPhone").placeholder = tr("bizPhone");
      document.getElementById("paymentTerms").placeholder = tr("paymentTerms");
      document.getElementById("discountDefault").placeholder = tr("discountDefault");
      document.getElementById("saveBiz").textContent = tr("saveBiz");
      document.getElementById("client").placeholder = tr("client");
      document.getElementById("address").placeholder = tr("address");
      document.getElementById("phone").placeholder = tr("phone");
      document.getElementById("email").placeholder = tr("email");
      document.getElementById("crew").placeholder = tr("crew");
      document.getElementById("lblPricing").textContent = tr("pricing");
      document.getElementById("optRooms").textContent = tr("rooms");
      document.getElementById("optSqft").textContent = tr("sqft");
      document.getElementById("addLine").textContent = tr("addLine");
      document.getElementById("sqft").placeholder = tr("sqftPh");
      document.getElementById("optStd").textContent = tr("std");
      document.getElementById("optDeep").textContent = tr("deepRate");
      document.getElementById("optCustom").textContent = tr("custom");
      document.getElementById("customRate").placeholder = tr("customPh");
      document.getElementById("lblService").textContent = tr("service");
      document.getElementById("optMaint").textContent = tr("maint");
      document.getElementById("optDeepSvc").textContent = tr("deep");
      document.getElementById("optMove").textContent = tr("move");
      document.getElementById("optPost").textContent = tr("post");
      document.getElementById("lblFreq").textContent = tr("freq");
      document.getElementById("optOnce").textContent = tr("once");
      document.getElementById("optWeek").textContent = tr("week");
      document.getElementById("optBi").textContent = tr("bi");
      document.getElementById("optMonth").textContent = tr("month");
      document.getElementById("lblEco").textContent = tr("eco");
      document.getElementById("countyTax").placeholder = tr("tax");
      document.getElementById("discount").placeholder = tr("extraDisc");
      document.getElementById("notes").placeholder = tr("notes");
      document.getElementById("save").textContent = tr("save");
      document.getElementById("clearBtn").textContent = tr("clear");
      document.getElementById("btnEn").classList.toggle("active", lang === "en");
      document.getElementById("btnEs").classList.toggle("active", lang === "es");
      document.querySelectorAll(".svc").forEach(sel => {
        const val = sel.value;
        sel.innerHTML = t[lang].roomsList.map(s => `<option ${s===val?"selected":""}>${s}</option>`).join("");
      });
      render();
    }

    function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
    function save(items) { localStorage.setItem(KEY, JSON.stringify(items)); }
    function loadBiz() { try { return JSON.parse(localStorage.getItem(BIZ_KEY)) || { paymentTerms: 14, discountDefault: 0, stdRate: 0.078, deepRate: 0.12 }; } catch { return { paymentTerms: 14, discountDefault: 0, stdRate: 0.078, deepRate: 0.12 }; } }
    function saveBiz(biz) { localStorage.setItem(BIZ_KEY, JSON.stringify(biz)); }
    function money(n) { return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function nextInvoiceNum() { const jobs = load(); const nums = jobs.map(j => j.invoiceNum || 0); return Math.max(1000, ...nums) + 1; }

    function addLineRow(service = t[lang].roomsList[0], qty = 1, price = "") {
      const div = document.createElement("div");
      div.className = "line-item";
      div.innerHTML = `<select class="svc">${t[lang].roomsList.map(s => `<option ${s===service?"selected":""}>${s}</option>`).join("")}</select>
        <input class="qty" type="number" step="1" min="1" value="${qty}" placeholder="Qty" />
        <input class="price" type="number" step="0.01" value="${price}" placeholder="$" />`;
      document.getElementById("lines").appendChild(div);
    }

    function getLines() {
      return Array.from(document.querySelectorAll(".line-item")).map(row => ({
        service: row.querySelector(".svc").value,
        qty: parseFloat(row.querySelector(".qty").value) || 1,
        price: parseFloat(row.querySelector(".price").value) || 0
      })).filter(l => l.price > 0);
    }

    function calc(job) {
      let subtotal = 0;
      if (job.pricingMethod === "sqft") {
        const rate = job.rateType === "custom" ? (job.customRate || 0) : parseFloat(job.rateType || 0);
        subtotal = (job.sqft || 0) * rate;
      } else {
        subtotal = (job.lines || []).reduce((sum, l) => sum + (l.qty * l.price), 0);
      }
      const freqDiscount = subtotal * ((job.frequency || 0) / 100);
      const extraDiscount = (subtotal - freqDiscount) * ((job.discount || 0) / 100);
      const afterDiscount = subtotal - freqDiscount - extraDiscount;
      let eco = 0;
      if (job.ecoUpcharge) eco = afterDiscount * 0.15;
      const afterEco = afterDiscount + eco;
      const tax = afterEco * ((job.countyTax || 0) / 100);
      return { subtotal, freqDiscount, extraDiscount, eco, afterEco, tax, total: afterEco + tax };
    }

    function dueDate(job) {
      const biz = loadBiz();
      const days = biz.paymentTerms || 14;
      const d = new Date(job.created);
      d.setDate(d.getDate() + days);
      return d.toLocaleDateString();
    }

    async function sendToSheet(job) {
      const c = calc(job);
      let services = "";
      if (job.pricingMethod === "sqft") {
        const rate = job.rateType === "custom" ? job.customRate : parseFloat(job.rateType || 0);
        services = `Sqft: ${job.sqft} @ $${rate}`;
      } else {
        services = (job.lines || []).map(l => `${l.qty}x ${l.service} @ $${l.price}`).join("; ");
      }
      const params = new URLSearchParams({
        date: new Date(job.created).toISOString().slice(0, 10),
        client: job.client,
        address: job.address || "",
        phone: job.phone || "",
        email: job.email || "",
        crew: job.crew || "",
        status: job.status,
        services,
        subtotal: c.subtotal,
        countyTax: job.countyTax || 0,
        tax: c.tax,
        total: c.total,
        notes: job.notes || ""
      });
      try {
        await fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: params });
      } catch (e) {
        console.log("Sheet sync failed", e);
      }
    }

    function makeInvoice(job) {
      const c = calc(job);
      const biz = loadBiz();
      const doc = new jsPDF();
      const date = new Date(job.created).toLocaleDateString();
      const invNum = job.invoiceNum || "—";
      const due = dueDate(job);
      doc.setFontSize(18); doc.text(biz.name || (lang==="es" ? "Servicios de Limpieza" : "House Cleaning Services"), 20, 22);
      doc.setFontSize(10); if (biz.address) doc.text(biz.address, 20, 28); if (biz.phone) doc.text(biz.phone, 20, 34);
      doc.setFontSize(16); doc.text(lang==="es" ? "FACTURA" : "INVOICE", 140, 22);
      doc.setFontSize(11); doc.text(`#${invNum}`, 140, 30); doc.text(`${lang==="es"?"Fecha":"Date"}: ${date}`, 140, 36); doc.text(`${lang==="es"?"Vence":"Due"}: ${due}`, 140, 42);
      doc.setFontSize(11); doc.text(lang==="es" ? "Facturar a:" : "Bill To:", 20, 56);
      doc.setFontSize(12); doc.text(job.client, 20, 63);
      doc.setFontSize(10);
      if (job.address) { const addrLines = doc.splitTextToSize(job.address, 90); doc.text(addrLines, 20, 69); }
      if (job.phone) doc.text(job.phone, 20, 84); if (job.email) doc.text(job.email, 20, 90);
      if (job.crew) { doc.setFontSize(11); doc.text(`${lang==="es"?"Limpiador":"Cleaner"}: ${job.crew}`, 120, 56); }
      let y = 105; doc.setFontSize(11); doc.text(lang==="es"?"Descripción":"Description", 20, y); doc.text("Qty", 110, y); doc.text(lang==="es"?"Precio":"Price", 140, y); doc.text(lang==="es"?"Monto":"Amount", 170, y);
      y += 5; doc.setLineWidth(0.2); doc.line(20, y, 190, y); y += 8;
      if (job.pricingMethod === "sqft") {
        const rate = job.rateType === "custom" ? job.customRate : parseFloat(job.rateType);
        doc.setFontSize(10); doc.text(`${lang==="es"?"Limpieza por pies":"Square footage clean"} (${job.sqft} @ ${money(rate)})`, 20, y);
        doc.text("1", 110, y); doc.text(money(rate), 140, y); doc.text(money(job.sqft * rate), 170, y); y += 7;
      } else {
        (job.lines || []).forEach(line => {
          const amt = line.qty * line.price; doc.setFontSize(10);
          doc.text(line.service, 20, y); doc.text(String(line.qty), 110, y); doc.text(money(line.price), 140, y); doc.text(money(amt), 170, y); y += 7;
        });
      }
      y += 4; doc.line(20, y, 190, y); y += 10; doc.setFontSize(11);
      doc.text(`${lang==="es"?"Subtotal":"Subtotal"}: ${money(c.subtotal)}`, 130, y); y += 7;
      if (c.freqDiscount > 0) { doc.text(`${lang==="es"?"Desc. frecuencia":"Frequency discount"}: -${money(c.freqDiscount)}`, 130, y); y += 7; }
      if (c.extraDiscount > 0) { doc.text(`${lang==="es"?"Desc. extra":"Extra discount"}: -${money(c.extraDiscount)}`, 130, y); y += 7; }
      if (c.eco > 0) { doc.text(`${lang==="es"?"Químicos eco (+15%)":"Eco chemicals (+15%)"}: +${money(c.eco)}`, 130, y); y += 7; }
      if (job.countyTax > 0) { doc.text(`${lang==="es"?"Impuesto":"Tax"} (${job.countyTax}%): ${money(c.tax)}`, 130, y); y += 7; }
      doc.setFontSize(13); doc.text(`${lang==="es"?"Total a pagar":"Total Due"}: ${money(c.total)}`, 130, y);
      y += 12; doc.setFontSize(10); doc.text(`${lang==="es"?"Servicio":"Service"}: ${job.serviceLevel || ""}`, 20, y);
      y += 6; doc.text(`${lang==="es"?"Términos de pago":"Payment terms"}: Net ${biz.paymentTerms || 14} ${lang==="es"?"días":"days"}`, 20, y);
      if (job.notes) { y += 10; doc.text(lang==="es"?"Notas:":"Notes:", 20, y); y += 6; const split = doc.splitTextToSize(job.notes, 170); doc.text(split, 20, y); }
      doc.setFontSize(9); doc.text(lang==="es"?"¡Gracias por su negocio!":"Thank you for your business!", 20, 270);
      doc.save(`Invoice-${invNum}-${job.client.replace(/\s+/g, "-")}.pdf`);
    }

    function render() {
      const jobs = load();
      let received = 0, pending = 0;
      const list = document.getElementById("list");
      list.innerHTML = "";
      jobs.forEach(job => {
        const c = calc(job);
        if (job.status === "paid") received += c.total;
        else if (job.status === "invoiced") pending += c.total;
        const div = document.createElement("div");
        div.className = "job";
        let actions = `<button data-id="${job.id}" data-action="pdf">${tr("viewInvoice")}</button>`;
        if (job.status === "quote") actions += `<button data-id="${job.id}" data-action="accept">${tr("accept")}</button>`;
        if (job.status === "accepted") actions += `<button data-id="${job.id}" data-action="start">${tr("start")}</button>`;
        if (job.status === "wip") actions += `<button data-id="${job.id}" data-action="invoice">${tr("invoice")}</button>`;
        if (job.status === "invoiced") actions += `<button data-id="${job.id}" data-action="paid">${tr("paid")}</button>`;
        let linesText = "";
        if (job.pricingMethod === "sqft") {
          linesText = `${job.sqft} sqft @ ${job.rateType === "custom" ? money(job.customRate) : money(job.rateType)}/sqft`;
        } else {
          linesText = (job.lines || []).map(l => `${l.qty}× ${l.service} @ ${money(l.price)}`).join("<br>");
        }
        const label = t[lang].statuses[job.status] || job.status;
        div.innerHTML = `<div class="top"><div>
              <div class="client">${job.client} <span class="status-badge">${label}</span></div>
              <div class="meta">${job.crew || tr("noCrew")} · ${job.serviceLevel || ""} ${job.ecoUpcharge ? "· Eco" : ""}</div>
              ${job.address ? `<div class="meta">${job.address}</div>` : ""}
              <div class="lines">${linesText || tr("noItems")}</div>
              ${job.notes ? `<div class="meta">${tr("notesPrefix")}${job.notes}</div>` : ""}
            </div><div class="amount">${money(c.total)}</div></div>
          <div class="actions">${actions}</div>`;
        list.appendChild(div);
      });
      document.getElementById("received").textContent = money(received);
      document.getElementById("pending").textContent = money(pending);
      document.getElementById("jobCount").textContent = jobs.length;
      list.querySelectorAll("button").forEach(btn => { btn.onclick = () => action(btn.dataset.id, btn.dataset.action); });
    }

    function action(id, act) {
      const jobs = load();
      const job = jobs.find(j => j.id === id);
      if (!job) return;
      if (act === "pdf") { makeInvoice(job); return; }
      if (act === "accept") job.status = "accepted";
      else if (act === "start") job.status = "wip";
      else if (act === "invoice") { job.status = "invoiced"; job.invoiceDate = Date.now(); if (!job.invoiceNum) job.invoiceNum = nextInvoiceNum(); }
      else if (act === "paid") job.status = "paid";
      save(jobs); render();
    }

    document.getElementById("pricingMethod").onchange = function() {
      const isSqft = this.value === "sqft";
      document.getElementById("roomsSection").style.display = isSqft ? "none" : "block";
      document.getElementById("sqftSection").style.display = isSqft ? "block" : "none";
    };
    document.getElementById("rateType").onchange = function() {
      document.getElementById("customRate").style.display = this.value === "custom" ? "block" : "none";
    };
    document.getElementById("btnEn").onclick = () => { lang = "en"; localStorage.setItem(LANG_KEY, lang); applyLang(); };
    document.getElementById("btnEs").onclick = () => { lang = "es"; localStorage.setItem(LANG_KEY, lang); applyLang(); };
    document.getElementById("addLine").onclick = () => addLineRow();
    document.getElementById("save").onclick = () => {
      const client = document.getElementById("client").value.trim();
      const pricingMethod = document.getElementById("pricingMethod").value;
      let lines = [], sqft = 0, rateType = "", customRate = 0;
      if (pricingMethod === "rooms") {
        lines = getLines();
        if (!client || lines.length === 0) return alert(tr("needRoom"));
      } else {
        sqft = parseFloat(document.getElementById("sqft").value) || 0;
        rateType = document.getElementById("rateType").value;
        customRate = parseFloat(document.getElementById("customRate").value) || 0;
        if (!client || sqft <= 0) return alert(tr("needSqft"));
        if (rateType === "custom" && customRate <= 0) return alert(tr("needCustom"));
      }
      const jobs = load();
      const job = {
        id: Date.now().toString(), invoiceNum: nextInvoiceNum(), client,
        address: document.getElementById("address").value.trim(), phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(), crew: document.getElementById("crew").value.trim(),
        pricingMethod, lines, sqft, rateType, customRate,
        serviceLevel: document.getElementById("serviceLevel").value,
        frequency: parseFloat(document.getElementById("frequency").value) || 0,
        ecoUpcharge: document.getElementById("ecoUpcharge").checked,
        countyTax: parseFloat(document.getElementById("countyTax").value) || 0,
        discount: parseFloat(document.getElementById("discount").value) || 0,
        notes: document.getElementById("notes").value.trim(), status: "quote", created: Date.now()
      };
      jobs.push(job); save(jobs); sendToSheet(job);
      render();
      alert(lang === "es" ? "Trabajo guardado." : "Job saved.");
      document.getElementById("client").value = "";
      document.getElementById("address").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("email").value = "";
      document.getElementById("crew").value = "";
      document.getElementById("notes").value = "";
      document.getElementById("discount").value = "0";
      document.getElementById("lines").innerHTML = "";
      document.getElementById("ecoUpcharge").checked = false;
      addLineRow();
    };
    document.getElementById("saveBiz").onclick = () => {
      const biz = { name: document.getElementById("bizName").value.trim(), address: document.getElementById("bizAddress").value.trim(),
        phone: document.getElementById("bizPhone").value.trim(), paymentTerms: parseInt(document.getElementById("paymentTerms").value) || 14,
        discountDefault: parseFloat(document.getElementById("discountDefault").value) || 0,
        stdRate: parseFloat(document.getElementById("stdRate").value) || 0.078,
        deepRate: parseFloat(document.getElementById("deepRate").value) || 0.12 };
      saveBiz(biz); alert(tr("bizSaved")); updateRateOptions();
    };
    document.getElementById("clearBtn").onclick = () => {
      if (confirm(tr("clearConfirm"))) { localStorage.removeItem(KEY); render(); alert(tr("cleared")); }
    };

    function updateRateOptions() {
      const biz = loadBiz();
      const std = biz.stdRate || 0.078;
      const deep = biz.deepRate || 0.12;
      const optStd = document.getElementById("optStd");
      const optDeep = document.getElementById("optDeep");
      if (optStd) { optStd.value = std; optStd.textContent = `Standard ($${std}/sqft)`; }
      if (optDeep) { optDeep.value = deep; optDeep.textContent = `Deep Clean ($${deep}/sqft)`; }
      if (lang === "es") {
        if (optStd) optStd.textContent = `Estándar ($${std}/pie²)`;
        if (optDeep) optDeep.textContent = `Limpieza profunda ($${deep}/pie²)`;
      }
    }

    const biz = loadBiz();
    if (biz.name) document.getElementById("bizName").value = biz.name;
    if (biz.address) document.getElementById("bizAddress").value = biz.address;
    if (biz.phone) document.getElementById("bizPhone").value = biz.phone;
    if (biz.paymentTerms) document.getElementById("paymentTerms").value = biz.paymentTerms;
    if (biz.discountDefault) document.getElementById("discountDefault").value = biz.discountDefault;
    if (biz.stdRate) document.getElementById("stdRate").value = biz.stdRate;
    if (biz.deepRate) document.getElementById("deepRate").value = biz.deepRate;
    updateRateOptions();
    addLineRow();
    applyLang();
    if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
  </script>
</body>
</html>
